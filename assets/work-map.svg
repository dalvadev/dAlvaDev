<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="336" viewBox="0 0 1040 336" role="img" aria-labelledby="title desc">
<title id="title">Mi enfoque de trabajo</title><desc id="desc">Ingeniería, software, datos y territorio se conectan en el diseño de soluciones útiles. Mapa conceptual.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09151B"/><stop offset="1" stop-color="#112B2C"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#80E5C5" stop-opacity=".11"/><stop offset="1" stop-color="#80E5C5" stop-opacity="0"/></radialGradient>
 <linearGradient id="signal"><stop stop-color="#80E5C5" stop-opacity=".08"/><stop offset=".65" stop-color="#80E5C5"/><stop offset="1" stop-color="#ECCB8E"/></linearGradient>
 <clipPath id="bounds"><rect width="1040" height="336" rx="24"/></clipPath>
</defs>
<style>
 text {font-family: 'Segoe UI', Arial, sans-serif}
 .mono {font-family: Consolas, 'Liberation Mono', monospace;letter-spacing:2px}
 .float {animation: float 10s ease-in-out infinite}
 .pulse {animation: pulse 5s ease-in-out infinite}
 .pulse2 {animation: pulse 5s ease-in-out -2.5s infinite}
 .signal {stroke-dasharray:14 140;animation: signal 18s linear infinite}
 .scan {stroke-dasharray:100 1100;animation: signal 24s linear infinite}
 @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse {0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes signal {to{stroke-dashoffset:-1200}}
 @media (prefers-reduced-motion:reduce) {.float,.pulse,.pulse2,.signal,.scan{animation:none!important}}
</style>
<g clip-path="url(#bounds)"><rect width="1040" height="336" fill="url(#bg)"/><text x="44" y="45" font-size="13" fill="#80E5C5" font-weight="400" class="mono">UN PERFIL, CUATRO CONEXIONES</text><path d="M340,110 C410,110 406,164 454,164" fill="none" stroke="#345452" stroke-width="1.5"/><path d="M340,110 C410,110 406,164 454,164" fill="none" stroke="#80E5C5" stroke-width="2" class="signal"/><path d="M700,110 C628,110 640,164 586,164" fill="none" stroke="#345452" stroke-width="1.5"/><path d="M700,110 C628,110 640,164 586,164" fill="none" stroke="#80E5C5" stroke-width="2" class="signal"/><path d="M340,240 C415,240 397,184 454,184" fill="none" stroke="#345452" stroke-width="1.5"/><path d="M340,240 C415,240 397,184 454,184" fill="none" stroke="#80E5C5" stroke-width="2" class="signal"/><path d="M700,240 C628,240 637,184 586,184" fill="none" stroke="#345452" stroke-width="1.5"/><path d="M700,240 C628,240 637,184 586,184" fill="none" stroke="#80E5C5" stroke-width="2" class="signal"/><circle cx="520" cy="176" r="76" fill="#102629" stroke="#3B7065"/><circle cx="520" cy="176" r="65" fill="none" stroke="#21473F" stroke-dasharray="2 8"/><text x="520" y="171" font-size="15" fill="#80E5C5" font-weight="600" text-anchor="middle" letter-spacing="1">SOLUCIONES</text><text x="520" y="196" font-size="28" fill="#F0F5F2" font-weight="600" text-anchor="middle">útiles</text><rect x="44" y="76" width="296" height="97" rx="12" fill="#112327" stroke="#294444"/><text x="62" y="101" font-size="12" fill="#80E5C5" font-weight="400" class="mono">01</text><text x="62" y="127" font-size="17" fill="#F0F5F2" font-weight="600" >Ingeniería + gestión</text><text x="62" y="153" font-size="13" fill="#B2C7C1" font-weight="400" >Procesos · proyectos · articulación</text><rect x="700" y="76" width="296" height="97" rx="12" fill="#112327" stroke="#294444"/><text x="718" y="101" font-size="12" fill="#96BDFF" font-weight="400" class="mono">02</text><text x="718" y="127" font-size="17" fill="#F0F5F2" font-weight="600" >Software + automatización</text><text x="718" y="153" font-size="13" fill="#B2C7C1" font-weight="400" >Aplicaciones · flujos · experiencia</text><rect x="44" y="208" width="296" height="97" rx="12" fill="#112327" stroke="#294444"/><text x="62" y="233" font-size="12" fill="#96BDFF" font-weight="400" class="mono">03</text><text x="62" y="259" font-size="17" fill="#F0F5F2" font-weight="600" >Datos + evidencia</text><text x="62" y="285" font-size="13" fill="#B2C7C1" font-weight="400" >Modelos · indicadores · decisiones</text><rect x="700" y="208" width="296" height="97" rx="12" fill="#112327" stroke="#294444"/><text x="718" y="233" font-size="12" fill="#ECCB8E" font-weight="400" class="mono">04</text><text x="718" y="259" font-size="17" fill="#F0F5F2" font-weight="600" >Territorio + comunidad</text><text x="718" y="285" font-size="13" fill="#B2C7C1" font-weight="400" >RSU · educación · agroecosistemas</text></g>
<rect x=".5" y=".5" width="1039" height="335" rx="24" fill="none" stroke="#284345"/>
